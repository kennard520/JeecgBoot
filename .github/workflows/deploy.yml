name: Deploy

on:
  push:
    branches: [main]
    paths:
      - 'jeecg-boot/**'
      - 'jeecgboot-vue3/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      profile:
        description: 'Spring profile（默认 dm8 = 达梦数据库）'
        required: false
        default: 'dm8'

concurrency:
  group: smart-entry-production
  cancel-in-progress: false

env:
  ACR_REGISTRY: crpi-2ygmzugyhvp3nw13.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NAMESPACE: kuawei
  IMAGE_NAME: jeecgboot
  CONTAINER_NAME: cit-jeecgboot
  REMOTE_USER: root
  REMOTE_HOST: ${{ secrets.TENCENT_HOST }}
  PROJECT_DIR: jeecg-boot
  MODULE_PATH: jeecg-boot/jeecg-module-system/jeecg-system-start
  FRONTEND_DIR: jeecgboot-vue3
  FRONTEND_ROOT: /var/wwwroot/cit/dist

jobs:
  # 阶段 1：编译 jar，作为 artifact 传给下一个 job
  build:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.sha.outputs.short }}
    steps:
      - uses: actions/checkout@v4

      - id: sha
        run: echo "short=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Test custom frontend workflow
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm exec jest tests/unit/custom --runInBand --env=node

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: pnpm build

      - name: Package frontend artifact
        run: tar -C ${{ env.FRONTEND_DIR }}/dist -czf frontend-dist.tar.gz .

      - name: Build jar (jeecg-system-start + 依赖模块)
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mvn -B -DskipTests \
            -pl jeecg-module-system/jeecg-system-start -am \
            clean package

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: ${{ env.MODULE_PATH }}/target/jeecg-system-start-*.jar
          retention-days: 1
          if-no-files-found: error

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist.tar.gz
          retention-days: 1
          if-no-files-found: error

  # 阶段 2：构建镜像 + 推送到 ACR
  push:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4   # 拉 Dockerfile

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: ${{ env.MODULE_PATH }}/target/

      - name: Login ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ env.MODULE_PATH }}
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.short_sha }}
            ${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:latest

  # 阶段 3：SSH 到腾讯云拉镜像 + 重启 + 健康检查 + 失败回滚
  deploy:
    runs-on: ubuntu-latest
    needs: [build, push]
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: deploy-artifacts

      - name: Upload frontend artifact to production
        uses: appleboy/scp-action@v1
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          source: deploy-artifacts/frontend-dist.tar.gz
          target: /tmp/cit-frontend-${{ needs.build.outputs.short_sha }}
          strip_components: 1

      - name: Deploy ${{ env.IMAGE_NAME }}
        uses: appleboy/ssh-action@v1
        env:
          PROFILE: ${{ github.event.inputs.profile || 'dm8' }}
        with:
          host: ${{ env.REMOTE_HOST }}
          username: ${{ env.REMOTE_USER }}
          key: ${{ secrets.TENCENT_SSH_KEY }}
          envs: PROFILE
          script: |
            set -e
            exec 9>/var/lock/cit-jeecgboot-deploy.lock
            flock -w 600 9
            NAME=${{ env.CONTAINER_NAME }}
            IMAGE=${{ env.ACR_REGISTRY }}/${{ env.ACR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.short_sha }}
            APP_DIR=/opt/app/${NAME}
            LOG_DIR=${APP_DIR}/logs
            CONFIG_DIR=${APP_DIR}/config
            UPLOAD_DIR=${APP_DIR}/upload
            mkdir -p $LOG_DIR $CONFIG_DIR $UPLOAD_DIR

            docker login ${{ env.ACR_REGISTRY }} -u '${{ secrets.ACR_USERNAME }}' -p '${{ secrets.ACR_PASSWORD }}'
            docker pull $IMAGE

            # 记录旧镜像用于回滚
            OLD_IMAGE=$(docker inspect $NAME --format '{{.Config.Image}}' 2>/dev/null || echo "")
            echo "Old image: $OLD_IMAGE"

            # 配置外挂约定：
            # 把 application-${PROFILE}.yml 放到服务器 /opt/app/cit-jeecgboot/config/，
            # Spring Boot 启动时会从 /jeecg-boot/config/ 自动加载（优先级高于 jar 内部）。
            # 默认 PROFILE=dm8（达梦数据库），如需其它环境通过 workflow_dispatch 的 profile 参数覆盖。
            # 这样数据库密码等敏感配置不进镜像。首次部署前需在服务器 mkdir + 放 application-${PROFILE}.yml。
            run_container() {
              local img=$1
              docker rm -f $NAME 2>/dev/null || true
              docker run -d --name $NAME \
                --restart=always \
                --network=host \
                -e SPRING_PROFILES_ACTIVE=$PROFILE \
                -e TZ=Asia/Shanghai \
                -v $LOG_DIR:/jeecg-boot/logs \
                -v $CONFIG_DIR:/jeecg-boot/config \
                -v $UPLOAD_DIR:/opt/upFiles \
                $img
            }

            wait_for_backend() {
              local release_name=$1
              for i in $(seq 1 36); do
                sleep 5
                local status
                status=$(docker inspect $NAME --format '{{.State.Status}}' 2>/dev/null || echo "missing")
                if [ "$status" != "running" ]; then
                  echo "$release_name is not running (status=$status)"
                  return 1
                fi
                if docker logs --tail 200 $NAME 2>&1 | grep -q "Application Jeecg-Boot is running"; then
                  echo "$release_name is healthy"
                  return 0
                fi
              done
              echo "$release_name did not become healthy in time"
              return 1
            }

            run_container $IMAGE

            # 健康检查：JeecgBoot 容器 CMD 内有 sleep 60，加上 JVM 启动 ~30s，总等待最长 3 分钟
            echo "Health check..."
            STARTED=false
            for i in $(seq 1 36); do
              sleep 5
              STATUS=$(docker inspect $NAME --format '{{.State.Status}}' 2>/dev/null || echo "missing")
              if [ "$STATUS" != "running" ]; then
                echo "Container not running (status=$STATUS) at iteration $i"
                break
              fi
              if docker logs --tail 200 $NAME 2>&1 | grep -q "Application Jeecg-Boot is running"; then
                echo "App started at iteration $i (~$((i*5))s)"
                STARTED=true
                break
              fi
            done

            FINAL=$(docker inspect $NAME --format '{{.State.Status}}' 2>/dev/null || echo "missing")
            if [ "$STARTED" != "true" ] || [ "$FINAL" != "running" ] || docker logs --tail 300 $NAME 2>&1 | grep -E "APPLICATION FAILED TO START|Application run failed" -q; then
              echo "===== Deploy failed, dumping last 300 lines of container log ====="
              docker logs --tail 300 $NAME 2>&1 || true
              echo "===== End of failed container log ====="
              echo "Deploy failed, rolling back..."
              if [ -n "$OLD_IMAGE" ]; then
                run_container "$OLD_IMAGE"
                wait_for_backend "rollback release"
                echo "Rolled back to $OLD_IMAGE"
              fi
              exit 1
            fi

            # 当前 smart-entry.citclub.org 由宿主机 Nginx 从该目录提供静态资源。
            FRONTEND_ARCHIVE=/tmp/cit-frontend-${{ needs.build.outputs.short_sha }}/frontend-dist.tar.gz
            FRONTEND_ROOT=${{ env.FRONTEND_ROOT }}
            FRONTEND_PARENT=$(dirname "$FRONTEND_ROOT")
            FRONTEND_STAGE=${FRONTEND_PARENT}/.dist-${{ needs.build.outputs.short_sha }}
            FRONTEND_BACKUP=${FRONTEND_PARENT}/.dist-backup-${{ needs.build.outputs.short_sha }}

            rollback_backend() {
              if [ -n "$OLD_IMAGE" ]; then
                run_container "$OLD_IMAGE"
                wait_for_backend "rollback release"
              fi
            }

            rollback_release() {
              echo "Restoring previous frontend and backend release..."
              rm -rf "$FRONTEND_ROOT"
              if [ -e "$FRONTEND_BACKUP" ] || [ -L "$FRONTEND_BACKUP" ]; then
                mv "$FRONTEND_BACKUP" "$FRONTEND_ROOT"
                nginx -t && systemctl reload nginx || true
              fi
              rollback_backend
            }

            rm -rf "$FRONTEND_STAGE" "$FRONTEND_BACKUP"
            mkdir -p "$FRONTEND_STAGE"
            if ! tar -xzf "$FRONTEND_ARCHIVE" -C "$FRONTEND_STAGE"; then
              echo "Frontend artifact extraction failed"
              rm -rf "$FRONTEND_STAGE"
              rollback_backend
              exit 1
            fi
            if [ ! -s "$FRONTEND_STAGE/index.html" ]; then
              echo "Frontend artifact is missing index.html"
              rm -rf "$FRONTEND_STAGE"
              rollback_backend
              exit 1
            fi

            if [ -e "$FRONTEND_ROOT" ] || [ -L "$FRONTEND_ROOT" ]; then
              mv "$FRONTEND_ROOT" "$FRONTEND_BACKUP"
            fi
            mv "$FRONTEND_STAGE" "$FRONTEND_ROOT"

            if ! nginx -t || ! systemctl reload nginx; then
              echo "Frontend deploy failed, restoring previous assets..."
              rollback_release
              exit 1
            fi

            FRONTEND_HEALTH_BODY=$(mktemp)
            if ! curl -fSs --resolve smart-entry.citclub.org:443:127.0.0.1 \
              https://smart-entry.citclub.org/ --max-time 20 -o "$FRONTEND_HEALTH_BODY" \
              || ! grep -q 'id="app"' "$FRONTEND_HEALTH_BODY"; then
              echo "Frontend health check failed"
              rm -f "$FRONTEND_HEALTH_BODY"
              rollback_release
              exit 1
            fi

            FRONTEND_MAIN_ASSET=$(grep -o 'src="/js/[^"]*\.js"' "$FRONTEND_HEALTH_BODY" | head -n 1 | cut -d'"' -f2)
            if [ -z "$FRONTEND_MAIN_ASSET" ] \
              || ! curl -fSs --resolve smart-entry.citclub.org:443:127.0.0.1 \
                "https://smart-entry.citclub.org${FRONTEND_MAIN_ASSET}" --max-time 20 -o /dev/null; then
              echo "Frontend main asset health check failed"
              rm -f "$FRONTEND_HEALTH_BODY"
              rollback_release
              exit 1
            fi

            if ! curl -fSs --resolve smart-entry.citclub.org:443:127.0.0.1 \
              https://smart-entry.citclub.org/jeecgboot/sys/getEncryptedString --max-time 20 \
              | grep -q '"success":true'; then
              echo "Backend HTTP health check failed"
              rm -f "$FRONTEND_HEALTH_BODY"
              rollback_release
              exit 1
            fi
            rm -f "$FRONTEND_HEALTH_BODY"

            rm -rf "$FRONTEND_BACKUP"
            rm -rf /tmp/cit-frontend-${{ needs.build.outputs.short_sha }}

            echo "Deploy success"
            docker image prune -f || true
